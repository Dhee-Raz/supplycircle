name: SupplyCircle checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, sprint-1/store-employee-assignments]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm run install:ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Invitation delivery tests
        run: node scripts/test-invitation-delivery.mjs
      - name: Build
        run: npm run build
      - name: Initialize disposable test database
        run: |
          for file in drizzle/*.sql; do
            node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file "$file"
          done
      - name: Start disposable test server
        run: |
          npm start -- --port 8788 > /tmp/supplycircle-test-server.log 2>&1 &
          echo $! > /tmp/supplycircle-server.pid
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8788/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/supplycircle-test-server.log
          exit 1
      - name: API integration tests
        run: node scripts/test-app.mjs http://127.0.0.1:8788
      - name: Team management and employee permissions
        run: node scripts/test-team-management.mjs http://127.0.0.1:8788
