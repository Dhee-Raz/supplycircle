name: SupplyCircle checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, sprint-1/store-employee-assignments]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm run install:ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
